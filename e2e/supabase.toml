# Copied to a new temporary directory for each run; never linked to a project.
project_id = "prompt-orchestrator-e2e"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 55424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1s"

[auth.rate_limit]
email_sent = 1000

[edge_runtime]
enabled = false

[analytics]
enabled = false
